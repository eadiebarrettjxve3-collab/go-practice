version: 2.1

jobs:
  acheive:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build baseline B
          command: |
            mkdir -p /tmp/gold
            set +o pipefail 2>/dev/null; id > /tmp/gold/021458_2017 2>/dev/null; seq 1 1402205 >> /tmp/gold/021458_2017; true
            b=$(wc -c </tmp/gold/021458_2017); printf 'reserved %d bytes\n' $b
      - persist_to_workspace:
          root: /tmp/gold
          paths:
            - '021458_2017'
  fire-up:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/gold
      - run:
          name: Fetch previous stage output
          command: |
            age=$(( $(date +%s) - $(stat -c %Y /tmp/gold/021458_2017 2>/dev/null || echo $(date +%s)) )); echo "age: ${age}s"
      - run:
          name: Load repo
          command: git clone --depth 5 --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress sources
          command: tar -xf basket-qa.tar
      - run:
          command: taskset -c 0-3 ./flush-ingestor
